<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文研究控制台</title>
<style>body{font:16px system-ui;background:#f3f5f9;color:#182438;margin:0}main{max-width:1000px;margin:48px auto;padding:24px}section{background:white;border-radius:16px;padding:24px;margin:20px 0}button{background:#245bcb;color:white;border:0;border-radius:8px;padding:12px 18px;margin:5px;cursor:pointer}button:disabled{opacity:.5}label{display:inline-block;margin:12px}input{display:block;padding:10px;border:1px solid #ccd3df;border-radius:6px;max-width:230px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526277}.cards{display:flex;gap:18px;flex-wrap:wrap}.cards section{flex:1;min-width:180px}h1{font-size:32px}h2{font-size:20px}</style>
<main><h1>论文研究控制台</h1><p>ECCV 2026 · 使用现有工作流与断点数据</p>
<section><h2>① 准备运行环境</h2><button onclick="act('services')">启动 Docker 与服务</button><button onclick="act('status')">查询后台任务状态</button><pre id="message">正在读取…</pre></section>
<div class="cards"><section><h2>arXiv 映射</h2><pre id="mapping"></pre><p id="mappingState"></p></section><section><h2>论文分析</h2><pre id="analysis"></pre></section><section><h2>点赞数据</h2><pre id="likes"></pre></section></div>
<section><h2>② 继续收集与分析</h2><p>先继续映射，再开始分析。分析读取启动时已导出的匹配结果；映射增加后，再续跑一轮。</p><button onclick="act('map')">开始／继续 arXiv 映射</button><button onclick="act('stop-map')">停止映射</button><hr>
<label>运行名称<input id="run_id" value="eccv-2026-luna-full-01"></label><label>本轮新增分析上限（0 为不限）<input id="max_new_analyses_per_run" type="number" min="0" max="10000" value="400"></label><label>并发论文数（1–3）<input id="analysis_concurrency" type="number" min="1" max="3" value="1"></label><label>LLM 请求间隔（秒）<input id="analysis_request_interval_seconds" type="number" min="0" max="300" value="4"></label>
<p><small>保持运行名称可复用成功结果。新名称会创建独立结果集，可能产生重复调用费用。研究问题和模型沿用已配置工作流。</small></p><button onclick="act('start')">开始／继续论文分析</button><button onclick="act('stop')">停止论文任务</button><button onclick="act('reports')">打开结果文件夹</button></section>
<section><h2>最近失败原因</h2><pre id="errors"></pre><small>关闭网页不会停止任务。请保留启动窗口；退出后重新启动可从已保存结果继续。停止映射按钮只管理本控制台启动的映射进程。</small></section></main>
<script>const token='__TOKEN__'; const names={matched:'已匹配',not_found:'未找到',needs_review:'未达匹配标准',error:'请求失败',SUCCESS:'成功',FAILED:'失败',DEFERRED:'待下轮'};async function refresh(){try{const r=await fetch('/status');const s=await r.json();document.getElementById('message').textContent=s.message;for(const k of ['mapping','analysis','likes'])document.getElementById(k).textContent=Object.entries(s[k]).map(([a,b])=>(names[a]||a)+'：'+b).join('\n')||'暂无结果';document.getElementById('mappingState').textContent=s.mapping_running?'映射进程运行中':s.mapping_exit===null?'本控制台未启动映射':`映射已结束（退出码 ${s.mapping_exit}）`;document.getElementById('errors').textContent=s.errors.filter(Boolean).join('\n')||'暂无记录';document.querySelectorAll('button').forEach(b=>b.disabled=s.busy)}catch(e){document.getElementById('message').textContent='控制台连接中断，请重新打开启动入口'}}async function act(action){let p={action};for(const k of ['run_id','max_new_analyses_per_run','analysis_concurrency','analysis_request_interval_seconds'])p[k]=document.getElementById(k).value;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{let r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':token},body:JSON.stringify(p)});if(!r.ok)alert((await r.json()).error||'请求失败')}catch(e){alert('连接失败：'+e)}setTimeout(refresh,300)}refresh();setInterval(refresh,5000);</script></html>
